spring.application.name=WarrantyBox

# ---------- Server ----------
server.port=${SERVER_PORT:8080}

# ---------- MongoDB ----------
# In production, set MONGODB_URI as an environment variable, e.g.
#   mongodb://<user>:<password>@<host>:27017/warrantybox?authSource=admin
# Locally (no auth) it falls back to a plain localhost connection.
# MongoDB
spring.data.mongodb.uri=mongodb+srv://mongo:mangomango@apitesting.fdd2m4g.mongodb.net/stDB?appName=apiTesting
spring.data.mongodb.database=stDB

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ---------- File Upload ----------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
# Folder where invoices are stored on disk (created automatically at startup)
file.upload-dir=./uploads

# ---------- Logging ----------
logging.level.org.springframework.security=WARN
server.error.include-stacktrace=never
server.error.include-message=always

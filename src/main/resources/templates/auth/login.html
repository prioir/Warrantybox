<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WarrantyBox</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="auth-body">

<div class="auth-wrapper">
    <div class="auth-card">
        <a href="/" class="brand auth-brand">
            <span class="brand-mark">WB</span>
            <span class="brand-name">WarrantyBox</span>
        </a>
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Log in to your digital warranty locker.</p>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>
        <div class="alert alert-error" th:if="${param.error}">Invalid email or password.</div>
        <div class="alert alert-success" th:if="${param.logout}">You have been logged out.</div>

        <form th:action="@{/login}" method="post" class="auth-form">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="you@example.com" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p class="auth-switch">Don't have an account? <a th:href="@{/register}">Create one</a></p>
    </div>
</div>

</body>
</html>

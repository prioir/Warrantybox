<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Product - WarrantyBox' : 'Add Product - WarrantyBox'">Add Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page page-narrow">
    <div class="page-header">
        <div>
            <h1 th:text="${isEdit} ? 'Edit Product' : 'Add a New Product'">Add a New Product</h1>
            <p class="page-subtitle">Fill in the details below. Warranty end date is calculated automatically.</p>
        </div>
    </div>

    <div class="alert alert-error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form class="card form-card"
          th:action="${isEdit} ? @{/products/edit/{id}(id=${product.id})} : @{/products/add}"
          method="post" enctype="multipart/form-data">

        <div class="form-grid">
            <div class="form-field">
                <label for="name">Product Name</label>
                <input type="text" id="name" name="name" th:value="${product.name}" placeholder="HP EliteBook 840 G6" required>
            </div>

            <div class="form-field">
                <label for="brand">Brand</label>
                <input type="text" id="brand" name="brand" th:value="${product.brand}" placeholder="HP" required>
            </div>

            <div class="form-field">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" th:value="${product.category}" placeholder="Laptop" required>
            </div>

            <div class="form-field">
                <label for="price">Price</label>
                <input type="number" id="price" name="price" th:value="${product.price}" step="0.01" min="0" placeholder="65000" required>
            </div>

            <div class="form-field">
                <label for="purchaseDate">Purchase Date</label>
                <input type="date" id="purchaseDate" name="purchaseDate" th:value="${product.purchaseDate}" required>
            </div>

            <div class="form-field">
                <label for="warrantyPeriod">Warranty Period (Years)</label>
                <input type="number" id="warrantyPeriod" name="warrantyPeriod" th:value="${product.warrantyPeriod}" min="0" max="50" placeholder="2" required>
            </div>

            <div class="form-field">
                <label for="serialNumber">Serial Number</label>
                <input type="text" id="serialNumber" name="serialNumber" th:value="${product.serialNumber}" placeholder="ABC123456">
            </div>

            <div class="form-field">
                <label for="storeName">Store Name</label>
                <input type="text" id="storeName" name="storeName" th:value="${product.storeName}" placeholder="Star Tech">
            </div>

            <div class="form-field form-field-full">
                <label for="invoiceFile">Invoice (PDF, JPG, JPEG, PNG - max 5MB)</label>
                <input type="file" id="invoiceFile" name="invoiceFile" accept=".pdf,.jpg,.jpeg,.png">
                <p class="field-hint" th:if="${isEdit and product.invoiceFileName}">
                    Current file: <span th:text="${product.invoiceFileName}">invoice.pdf</span>. Upload a new file to replace it.
                </p>
                <p class="field-hint" th:unless="${isEdit and product.invoiceFileName}">Optional - you can add this later.</p>
            </div>
        </div>

        <div class="form-actions">
            <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Save Changes' : 'Add Product'">Add Product</button>
        </div>
    </form>
</main>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
